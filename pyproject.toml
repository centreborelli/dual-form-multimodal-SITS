[project]
authors = [{name = "Iris Dumeur", email = "iris.dumeur@ens-paris-saclay.fr"}]
name = "cd_mm_sits"
requires-python = ">=3.11"
version = "0.1.0"
dependencies = [ "optuna>=4.3.0,<5", "hydra-optuna-sweeper>=1.1.2,<2", "optuna-integration[pytorch-lightning]>=4.3.0,<5", "sqlalchemy>=1.4,<2.0", "optuna-dashboard>=0.18.0,<0.19", "requests" , "segmentation-models-pytorch>=0.5.0,<0.6","polar>=0.0.127,<0.0.128"]


[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.pypi-dependencies]
cd_mm_sits = { path = ".", editable = true }
lightning = ">=2.5.5,<3"
torchmetrics = ">=1.7.1,<2"
ziptif = { path = "packages/ziptif", editable = true }

[tool.hatch.build]
packages = ["src/cd_mm_sits"]

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64","osx-arm64"]

[tool.pixi.feature.gpu]
system-requirements = { cuda = "12.0" }
platforms = ["linux-64"]

[tool.pixi.feature.gpu.pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cu124" }

[tool.pixi.feature.cpu.pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.dev.pypi-dependencies]
tensorboard-plugin-profile = ">=2.20.2,<3"

[tool.pixi.feature.dev.dependencies]
pre-commit = "*"
ruff = "==0.14.0"  # should match ./.pre-commit-config.yaml
pytest = ">=8.3.5,<9"
pytest-cov = "*"
mypy = "*"
pyupgrade = "*"
rope = ">=1.13.0,<2"
pyright= ">=1.1.406,<2"
[tool.pixi.environments]
default = { features = ["cpu"] }
gpu = { features = ["gpu"] }
dev = { features = ["dev", "gpu"], solve-group = "gpu" }
dev-cpu = { features = ["dev", "cpu"], solve-group = "default" }

[tool.pixi.dependencies]
einops = ">=0.8.1,<0.9"
hydra-core = ">=1.3.2,<2"
marimo = ">=0.13.6,<0.14"
pandas = ">=2.2.3,<3"
rioxarray = ">=0.19.0,<0.20"
matplotlib = ">=3.10.3,<4"
rasterio = ">=1.4.3,<2"
pydantic = ">=2.11.9,<3"
deepdiff = ">=8.5.0,<9"
tabulate = ">=0.9.0,<0.10"
ipykernel = ">=6.29.5,<7"
seaborn = ">=0.13.2,<0.14"
dask = ">=2025.5.1,<2026"
geopandas = ">=1.1.0,<2"
zarr = ">=3.0.8,<4"
tensorboard = ">=2.20.0,<3"

[tasks]
test = "pytest"
lint = "ruff check src"

[tool.pytest.ini_options]
testpaths=["tests"]
markers=["local","iris_local","gpu","critical"]
log_cli = true
log_level = "INFO"
# log_cli = true
# log_cli_level = "DEBUG"
log_cli_format = "%(message)s"

log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle (includes flake8)
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
]
ignore = [
  "E741",  # Ambiguous variable name
  "B007",
  # line too long; ruff will still format what it can anyway
  # so this mostly to avoid triggers on comments
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018"]  # allow 'useless' expressions

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
install_types = true
check_untyped_defs = true
allow_redefinition = true
pretty = true
python_version = "3.11"
exclude_gitignore = true

[tool.marimo.runtime]
output_max_bytes = 10_000_000
