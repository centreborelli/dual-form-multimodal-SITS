[project]
authors = [{name = "Iris Dumeur", email = "iris.dumeur[at]ens-paris-saclay.fr"}]
dependencies = []
name = "cd_mm_sits"
requires-python = "3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge","nvidia","pytorch"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
pixi_template = { path = ".", editable = true }

[tool.pixi.tasks]


[tool.pixi.feature.gpu.system-requirements]
cuda = "12.6"

[tool.pixi.feature.gpu.dependencies]
pytorch-cuda = {version="*",channel="pytorch"}
cuda={version="*",channel="nvidia"}
[tool.pixi.feature.cpu.dependencies]
pytorch= "*"

[tool.pixi.feature.dev.dependencies]
pre-commit = "*"
ruff = "*"
pytest = "*"
pytest-cov = "*"
mypy = "*"
isort = "*"
black = "*"
pyupgrade = "*"
flake8 = "*"
pylint = "*"

[tool.pixi.environments]
default = { features = ["cpu"], solve-group = "default" }
gpu = { features = ["gpu"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.dependencies]
pytorch = "*"
lightning = "*"
torchvision={version="*",channel="pytorch"}
torchmetrics = "*"
einops = "*"
hydra-core = "*"
tensorboard = "*"
marimo = "*"
[dependency-groups]
dev = ["perflint=*"]
[tool.pytest.ini_options]
testpaths=["tests"]
markers=["local"]

[tool.mypy]
python_version="3.11"
check_untyped_defs=true

[tasks]
test = "pytest"
lint = "ruff check src"