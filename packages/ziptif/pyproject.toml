[project]
name = "ziptif"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
  "tifffile>=2025.9.20,<2026"
, "zstd>=1.5.7.2,<2"
, "polars>=1.33.1,<2"
, "pydantic>=2.11.9,<3"
, "fire>=0.7.1,<0.8"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
ziptif = { path = ".", editable = true }

[tool.pixi.tasks]
