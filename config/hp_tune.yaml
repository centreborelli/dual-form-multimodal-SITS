defaults:
  - _self_
  - shared/shared_params
  - server: local
  - model: vanilla_unet_transformer.yaml
  - train: cd_train.yaml
  - datamodule: datamodule.yaml
  - metrics: cd.yaml
  - logger: default.yaml
  - callback: minimal.yaml
  - pruner: median.yaml
ckpt_path: null
hydra:
  run:
    dir: ${server.path_export_training_dir}/${hydra.job.name}/hp_tune/fold_${datamodule.fold_expe}/${suffix}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${server.path_export_training_dir}${hydra.job.name}/hp_tune/fold_${datamodule.fold_expe}
    subdir: ${hydra.job.override_dirname}
  job:
    name: solar_panel_detection
suffix: unet_transformer_causal_${model.is_causal}
pruning_monitor: val_f1_score
direction: maximize
n_trials: 50
sampler:
  _target_: optuna.samplers.TPESampler
  seed: 1234
  n_startup_trials: 10
search_space:
  train.train_config.lr:
    type: float
    low: 0.0001
    high: 0.1
    log: true
  train.train_config.batch_size:
    type: int
    low: 2
    high: 8
    step: 2
  model.temporal_encoder.num_layers:
     type: int
     low: 1
     high: 3
     step: 1
  shared.d_model:
     type: int
     low: 64
     high: 128
     step: 64
run_test: false
seed: 1
