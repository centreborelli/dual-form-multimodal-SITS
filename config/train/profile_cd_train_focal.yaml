train_config:
  _recursive_: false
  _target_: cd_mm_sits.lightning_module.template_module.TrainConfig
  loss:
    _target_: cd_mm_sits.lightning_module.losses.FocalLoss
    alpha: 0.83
    gamma: 1
  batch_size: 4
  optimizer:
    _target_: cd_mm_sits.lightning_module.hydra_dataclass.OptimizerAdamWConfig
  optimizer_monitor: val_loss
  scheduler:
    _target_: cd_mm_sits.lightning_module.hydra_dataclass.CAWConfig
    T_0: 10
  lr: 0.001
trainer:
  _target_: lightning.pytorch.Trainer
  log_every_n_steps: 2
  devices: 1
  accelerator: gpu
  strategy: auto
  max_epochs: 16
  min_epochs: 6
  limit_val_batches: 0.5
  limit_train_batches: 1.0
  check_val_every_n_epoch: 5
  profiler:
    _target_: lightning.pytorch.profilers.PyTorchProfiler
    filename: pytorch_profile
    record_module_names: true
    export_to_chrome: true
    use_cuda: true
    profile_memory: true


slurm_restart: false
