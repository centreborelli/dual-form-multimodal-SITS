train_config:
  _recursive_: false
  _target_: cd_mm_sits.lightning_module.template_module.TrainConfig
  loss:
    _target_: torch.nn.BCEWithLogitsLoss
    pos_weight:
      _target_: torch.tensor
      _args_: [[10.0]]
  batch_size: 4
  optimizer:
    _target_: cd_mm_sits.lightning_module.hydra_dataclass.OptimizerAdamConfig
  optimizer_monitor: val_loss
  scheduler:
    _target_: cd_mm_sits.lightning_module.hydra_dataclass.CAWConfig
    T_0: 10
  lr: 0.0006
trainer:
  _target_: lightning.pytorch.Trainer
  log_every_n_steps: 30
  devices: 1
  accelerator: cpu
  max_epochs: 500
  min_epochs: 50
  limit_val_batches: 1.0
  limit_train_batches: 1.0
  check_val_every_n_epoch: 2
  accumulate_grad_batches: 1
  strategy: ddp
slurm_restart: true
